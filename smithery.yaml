# Smithery.ai configuration for PushNotif MCP Server
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - pushnotifApiKey
    properties:
      pushnotifApiKey:
        type: string
        description: "Your PushNotif API key (pn_live_...) from https://pushnotif.biz.id/dashboard"
  commandFunction:
    |-
    (config) => ({
      command: 'node',
      args: ['src/index.js'],
      env: {
        PUSHNOTIF_API_KEY: config.pushnotifApiKey
      }
    })
